version: 2
updates:
  # Electron advisories are the ones that matter here: the app shipped on a
  # version with dozens of known CVEs before anyone noticed.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-build-tooling:
        patterns:
          - electron-builder
          - app-builder-*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
