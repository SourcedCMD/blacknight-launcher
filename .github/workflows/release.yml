name: Release

# Auto-update reads GitHub Releases, so a release has to exist for it to find.
# Pushing a version tag builds the Windows installer and publishes it, along
# with the latest.yml manifest electron-updater looks for.
on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand, to produce a build without tagging one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The icon is built from the committed PNG masters rather than being
      # taken on trust, so a stale .ico can never ship.
      - name: Rebuild the app icon
        run: npm run icon

      # The notes come from the CHANGELOG section release.js just rolled, so a
      # release is never published with an empty body. Node rather than awk in
      # a YAML block: the quoting between YAML, bash and awk mangles the
      # brackets in "## [1.0.1]" quietly.
      - name: Extract the release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.js "$GITHUB_REF_NAME"
            echo ""
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set these two repository secrets to produce a signed build. Without
          # them electron-builder still publishes, just unsigned, so a missing
          # certificate never blocks a release.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Put the notes on the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" --notes "${{ steps.notes.outputs.body }}" ||             echo "Could not attach notes; the release itself is published."

      # Kept even when publishing succeeds, so a tagged build is downloadable
      # from the run itself if the release step is ever reverted.
      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlackNightLauncher-Setup
          path: release/*.exe
          if-no-files-found: error
