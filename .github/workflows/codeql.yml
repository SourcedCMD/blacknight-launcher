name: CodeQL

# The launcher handles downloads, local accounts, IPC and a LAN listener, so
# static analysis is worth having on every change rather than once a release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches newly published rules against unchanged code.
    - cron: '0 4 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
