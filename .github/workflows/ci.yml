name: CI

# Runs on every push and pull request, so a broken main is obvious without
# waiting for someone to cut a release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The services are plain Node, so they are checked on Linux even though
      # the app itself only ships for Windows.
      - name: Check every file parses
        run: |
          find src electron scripts test -name '*.js' -print0 \
            | xargs -0 -n1 node --check
