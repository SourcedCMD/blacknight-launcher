name: CI

# Runs on every push and pull request, so a broken main is obvious without
# waiting for someone to cut a release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    # The services are plain Node, but the app only ships for Windows and the
    # runners differ in ways that matter: path separators, case sensitivity and
    # how the network treats unreachable addresses have all bitten this suite.
    # Testing both is how that stops being a surprise found on main.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap and fails fast, so it runs before the suite.
      - name: Lint
        run: npm run lint

      # Captured as well as printed, so a failure can be turned into
      # annotations rather than something you have to open the log to read.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Surface the failure
        if: failure()
        shell: bash
        run: node scripts/ci-annotate.js test-output.txt

      # The services have their own suite: it starts a real server on an
      # ephemeral port and talks to it over a socket, so it cannot share a
      # process with the launcher's tests.
      - name: Test the services
        shell: bash
        run: |
          set -o pipefail
          cd server && node --test --test-timeout=60000 2>&1 | tee ../server-output.txt

      - name: Surface the services failure
        if: failure()
        shell: bash
        run: node scripts/ci-annotate.js server-output.txt

      # Boots the real app and drives it through every view. Windows only:
      # that is the platform this ships on, and a headless Linux runner needs a
      # virtual display for a check that would be testing the display server as
      # much as the app.
      - name: Smoke test the app
        if: runner.os == 'Windows'
        run: npm run smoke

      # A launcher that takes two seconds to paint is a launcher people stop
      # opening. This fails the build rather than letting the number drift.
      - name: Check the performance budget
        run: npm run check:budget

      # The same idea for the generators and formatters that run on every
      # screen: measured, with budgets set at roughly eight times what the work
      # costs today, so a doubling trips it.
      - name: Check runtime performance
        run: npm run check:perf

      # The catalog is hosted, so a bad field should fail here rather than on
      # someone's machine.
      - name: Validate the catalog
        run: npm run check:catalog

      - name: Check every file parses
        shell: bash
        run: |
          find src electron scripts test server -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
