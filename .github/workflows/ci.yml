name: CI

# Runs on every push and pull request, so a broken main is obvious without
# waiting for someone to cut a release tag.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The catalog is hosted, so a bad field should fail here rather than on
      # someone's machine.
      - name: Validate the catalog
        run: npm run check:catalog

      # The services are plain Node, so they are checked on Linux even though
      # the app itself only ships for Windows.
      - name: Check every file parses
        run: |
          find src electron scripts test -name '*.js' -print0 \
            | xargs -0 -n1 node --check
