name: Bug report
description: Something in the launcher does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The launcher keeps a log. **Settings → Privacy → Launcher logs → Open logs**
        — attaching `launcher.log` makes almost every report faster to fix.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the launcher did instead.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed
      options: [Installer, Portable, Built from source]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the relevant part of launcher.log, or attach the file.
      render: text
